<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Change your temporary administrator password">
  <title>Change Password | Food Delivery</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/theme-palette.css">
  <style>
    .first-password-card{width:min(100% - 32px,520px);margin:8vh auto;padding:28px;border-radius:14px;background:var(--surface,#fff);box-shadow:0 8px 32px #00000012}
    .first-password-card h1{margin-top:0}.first-password-card label{display:block;margin:16px 0 6px;font-weight:600}
    .first-password-card input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbb;border-radius:8px}
    .first-password-card button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:8px;cursor:pointer}
    #passwordMessage{margin-top:12px;min-height:1.4em}
  </style>
</head>
<body>
  <header class="header"><a href="../../index.html" class="logo">Food<span>Delivery</span></a></header>
  <main class="auth-page">
    <section class="first-password-card">
      <h1>Change your temporary password</h1>
      <p>Your administrator account requires a new password before you can access the portal.</p>
      <form id="firstPasswordForm">
        <label for="currentPassword">Temporary password</label>
        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
        <label for="newPassword">New password (at least 8 characters)</label>
        <input id="newPassword" name="newPassword" type="password" minlength="8" autocomplete="new-password" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        <button id="changePasswordButton" type="submit">Change Password</button>
        <p id="passwordMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="../../assets/js/api-config.js"></script>
  <script src="../../assets/js/auth/auth-api.js"></script>
  <script>
  (() => {
    const form = document.getElementById("firstPasswordForm");
    const message = document.getElementById("passwordMessage");
    const button = document.getElementById("changePasswordButton");
    if (!window.FoodDeliveryAuthApi || !window.FoodDeliveryAuthApi.getToken()) {
      window.location.replace("login.html");
      return;
    }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const currentPassword = document.getElementById("currentPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      if (newPassword !== confirmPassword) { message.textContent = "The new passwords do not match."; return; }
      if (newPassword === currentPassword) { message.textContent = "Choose a password different from the temporary password."; return; }
      button.disabled = true;
      message.textContent = "Updating password…";
      try {
        await window.FoodDeliveryAuthApi.request("/auth/me/password", {
          method: "PATCH",
          body: { currentPassword, newPassword },
          authenticated: true
        });
        const sessionUser = window.FoodDeliveryAuthApi.getCurrentUser();
        if (sessionUser) {
          sessionUser.must_change_password = false;
          try { localStorage.setItem("foodDeliveryUser", JSON.stringify(sessionUser)); } catch {}
          try { sessionStorage.setItem("foodDeliveryUser", JSON.stringify(sessionUser)); } catch {}
        }
        message.textContent = "Password changed. Redirecting to your portal…";
        window.setTimeout(() => {
          window.location.replace(sessionUser && sessionUser.role === "super_admin" ? "../admin/dashboard.html" : "../admin/dashboard.html");
        }, 700);
      } catch (error) {
        message.textContent = error.message || "Could not change the password.";
        button.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
