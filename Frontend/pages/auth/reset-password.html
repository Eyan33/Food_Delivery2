<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose a new password for your Food Delivery account">
    <title>Reset Password | Food Delivery</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <header class="header">
        <a href="../../index.html" class="logo">Food<span>Delivery</span></a>
        <nav class="navigation">
            <span>Remember your password?</span>
            <a href="login.html" class="nav-button">Login</a>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-header">
                <h1>Choose a new password</h1>
                <p>Enter a new password for your Food Delivery account.</p>
            </div>

            <form id="resetPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="At least 8 characters"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="Enter the password again"
                        required
                    >
                </div>

                <div id="resetPasswordMessage" class="form-message" role="alert" aria-live="polite"></div>

                <button type="submit" class="auth-button" id="resetPasswordButton">
                    Reset Password
                </button>
            </form>

            <div class="auth-footer">
                <p><a href="login.html">Back to Login</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Food Delivery. All rights reserved.</p>
    </footer>

    <script src="../../assets/js/api-config.js"></script>
    <script src="../../assets/js/auth/reset-password.js"></script>
</body>
</html>
