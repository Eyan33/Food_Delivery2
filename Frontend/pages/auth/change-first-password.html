<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Change your temporary administrator password">
  <title>Change Password | Food Delivery</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/theme-palette.css">
  <link rel="stylesheet" href="../../assets/css/change-first-password.css">
</head>
<body>
  <header class="header"><a href="../../index.html" class="logo">Food<span>Delivery</span></a></header>
  <main class="auth-page">
    <section class="first-password-card">
      <h1>Change your temporary password</h1>
      <p>Your administrator account requires a new password before you can access the portal.</p>
      <form id="firstPasswordForm">
        <label for="currentPassword">Temporary password</label>
        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
        <label for="newPassword">New password (at least 8 characters)</label>
        <input id="newPassword" name="newPassword" type="password" minlength="8" autocomplete="new-password" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        <button id="changePasswordButton" type="submit">Change Password</button>
        <p id="passwordMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="../../assets/js/api-config.js"></script>
  <script src="../../assets/js/auth/auth-api.js"></script>
  <script src="../../assets/js/auth/change-first-password.js" defer></script>
</body>
</html>
