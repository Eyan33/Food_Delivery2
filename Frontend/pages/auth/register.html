<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Create your Food Delivery account">

    <title>Register | Food Delivery</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .password-input-wrap { position: relative; }
        .password-input-wrap input { padding-right: 48px; }
        .password-visibility-toggle {
            position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; padding: 0;
            border: 0; border-radius: 6px; background: transparent;
            color: #666; cursor: pointer;
        }
        .password-visibility-toggle:hover { color: var(--primary, #ff5a1f); background: #fff0e9; }
        .password-visibility-toggle:focus-visible { outline: 2px solid var(--primary, #ff5a1f); outline-offset: 2px; }
        .password-visibility-toggle svg { width: 20px; height: 20px; }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <a href="../../index.html" class="logo">
            Food<span>Delivery</span>
        </a>

        <nav class="navigation">

            <span>
                Already have an account?
            </span>

            <a href="login.html" class="nav-button">
                Login
            </a>

        </nav>

    </header>


    <!-- REGISTER PAGE -->
    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <h1>Create Account</h1>

                <p>
                    Sign up and start ordering food from your favorite restaurants.
                </p>

            </div>


            <!-- FORM -->

            <form id="registerForm" class="auth-form">

                <!-- First Name -->
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="first_name" placeholder="Enter your first name"
                        autocomplete="given-name" minlength="2" required>
                </div>

                <!-- Last Name -->
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="last_name" placeholder="Enter your last name"
                        autocomplete="family-name" minlength="2" required>
                </div>

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="e.g. 0712345678"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-input-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            minlength="8"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >
                        <button class="password-visibility-toggle" type="button" data-password-toggle="password"
                            aria-label="Show password" aria-pressed="false" title="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-input-wrap">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            minlength="8"
                            placeholder="Confirm password"
                            autocomplete="new-password"
                            required
                        >
                        <button class="password-visibility-toggle" type="button" data-password-toggle="confirmPassword"
                            aria-label="Show confirm password" aria-pressed="false" title="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                </div>


                <!-- Terms -->

                <div class="form-options">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the Terms and Conditions
                        </span>

                    </label>

                </div>


                <!-- Message -->

                <div
                    id="registerMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- Button -->

                <button
                    type="submit"
                    class="auth-button"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>


            <!-- Footer -->

            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            &copy; 2026 Food Delivery. All rights reserved.
        </p>

    </footer>


    <script src="../../assets/js/api-config.js"></script>
    <script src="../../assets/js/auth/auth-api.js"></script>
    <script src="../../assets/js/auth/register.js"></script>

</body>

</html>
