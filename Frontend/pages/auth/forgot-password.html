<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Reset your Food Delivery account password"
    >

    <title>Forgot Password | Food Delivery</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/theme-palette.css" />
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <a href="../../index.html" class="logo">
            Food<span>Delivery</span>
        </a>

        <nav class="navigation">

            <span>
                Remember your password?
            </span>

            <a href="login.html" class="nav-button">
                Login
            </a>

        </nav>

    </header>


    <!-- =========================================
         FORGOT PASSWORD
    ========================================== -->

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <h1>Forgot Password?</h1>

                <p>
                    Enter your email address and we'll send you
                    instructions to reset your password.
                </p>

            </div>


            <!-- RESET FORM -->

            <form
                id="forgotPasswordForm"
                class="auth-form"
            >

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Message -->

                <div
                    id="forgotPasswordMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="auth-button"
                    id="forgotPasswordButton"
                >
                    Send Reset Link
                </button>

            </form>


            <!-- BACK TO LOGIN -->

            <div class="auth-footer">

                <p>
                    Remember your password?
                    <a href="login.html">
                        Back to Login
                    </a>
                </p>

            </div>

        </section>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="footer">

        <p>
            &copy; 2026 Food Delivery. All rights reserved.
        </p>

    </footer>


    <script src="../../assets/js/api-config.js"></script>
    <script src="../../assets/js/auth/forgot-password.js"></script>

</body>

</html>
